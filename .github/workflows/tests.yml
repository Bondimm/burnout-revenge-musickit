name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon (arm64), macos-15-intel = Intel (x86_64)
        # ubuntu-latest = 24.04 x86_64; ubuntu-24.04-arm = Linux aarch64 (free for public repos)
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.11", "3.13"]
        # The installers work with any Python 3.12+: when not every package has a ready-made download for the
        # installed Python (e.g. a brand-new 3.15, or 3.14 on Intel Macs), they use another installed Python or
        # download a private one. "private" = skip the installed Pythons, as on a computer without Python.
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.14" }
          - { os: windows-latest, python: "3.15" }
          - { os: windows-latest, python: private }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: ubuntu-latest, python: private }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.14" }
          - { os: macos-latest, python: "3.15" }
          - { os: macos-latest, python: private }
          - { os: macos-15-intel, python: "3.14" }
          - { os: macos-15-intel, python: private }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    env:
      MUSICKIT_NO_PAUSE: "1"
      MUSICKIT_PRIVATE_PYTHON: ${{ matrix.python == 'private' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: matrix.python != 'private'
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Run setup.bat (the Windows installer)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          choco install ffmpeg -y --no-progress || exit /b 1
          call setup.bat || exit /b 1
          .venv\Scripts\python.exe --version
          call musickit-cli.bat --help > nul || exit /b 1
          call setup.bat || exit /b 1

      - name: Run setup.command (the macOS installer, downloads ffmpeg into ./ffmpeg/bin)
        if: runner.os == 'macOS'
        env:
          MUSICKIT_FFMPEG_DOWNLOAD: "1"
        run: ./setup.command

      - name: Backup ffmpeg download (macOS)
        if: runner.os == 'macOS'
        env:
          MUSICKIT_FFMPEG_DOWNLOAD: backup
        run: |
          mv ffmpeg ffmpeg-main
          ./setup.command
          file ffmpeg/bin/ffmpeg ffmpeg/bin/ffprobe
          ffmpeg/bin/ffprobe -hide_banner -version | head -n 1
          rm -rf ffmpeg && mv ffmpeg-main ffmpeg

      - name: Check the macOS launchers and ffmpeg
        if: runner.os == 'macOS'
        run: |
          test -x setup.command && test -x MusicKit.command && test -x musickit-cli.sh
          .venv/bin/python --version
          file ffmpeg/bin/ffmpeg ffmpeg/bin/ffprobe
          ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1
          ./musickit-cli.sh --help > /dev/null
          ./setup.command   # a second run only checks (idempotent)

      - name: System libraries (Linux, for the GUI screenshot only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgl1-mesa-dri libxkbcommon0 zenity

      - name: Run setup.sh (the Linux installer, downloads ffmpeg into ./ffmpeg/bin)
        if: runner.os == 'Linux'
        env:
          MUSICKIT_FFMPEG_DOWNLOAD: "1"
        run: ./setup.sh

      - name: Check the Linux launchers and ffmpeg
        if: runner.os == 'Linux'
        run: |
          test -x setup.sh && test -x MusicKit.sh && test -x musickit-cli.sh
          .venv/bin/python --version
          file ffmpeg/bin/ffmpeg ffmpeg/bin/ffprobe
          ffmpeg/bin/ffmpeg -hide_banner -version | head -n 1
          ./musickit-cli.sh --help > /dev/null
          ./setup.sh   # a second run only checks (idempotent)

      - name: Which Python the installer used
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -c "import sys, numpy, numba, imgui_bundle; print(sys.version); print(sys.executable)"
          if [ -d .python ]; then echo "private Python:"; ls .python; fi

      - name: Tests (disc tests skip without an ISO)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pytest -v -rs tests

      - name: GUI screenshot (macOS, needs an OpenGL context on the runner)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 5
        run: .venv/bin/python -m musickit gui --shot gui.png && file gui.png

      - name: GUI screenshot (Linux, xvfb + Mesa software rendering)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: xvfb-run -a .venv/bin/python -m musickit gui --shot gui.png && file gui.png

      - name: Upload the GUI screenshot
        if: runner.os != 'Windows' && hashFiles('gui.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}-py${{ matrix.python }}
          path: gui.png
          retention-days: 7

  no-python:
    # a Linux system without any Python: setup.sh downloads a private one
    name: debian-slim container / no Python installed
    runs-on: ubuntu-latest
    container: debian:12-slim
    timeout-minutes: 30
    env:
      MUSICKIT_NO_PAUSE: "1"
    steps:
      - name: Basic tools and the OpenGL libraries only (no Python)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils file libgl1 libegl1 libxkbcommon0
          if command -v python3 || command -v python; then echo "Python is installed"; exit 1; fi

      - uses: actions/checkout@v5

      - name: Run setup.sh
        run: ./setup.sh

      - name: Tests (disc tests skip without an ISO)
        run: |
          .venv/bin/python --version
          ./musickit-cli.sh --help > /dev/null
          .venv/bin/python -m pytest -v -rs tests
